schema_version: prifly-workflow-catalog/1
title: Pri-Fly workflow catalog
categories:
  software-delivery:
    title: Software delivery
    description: Development cycles for AI-assisted coding hosts such as Codex and Claude Code.
workflows:
  aif-classic:
    title: AI Factory classic development workflow
    description: Canonical AI Factory development workflow with bounded plan improvement; a stopped Run resumes where it stopped. Requires Pri-Fly 0.13.64.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-classic
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, codex-cli, codex-app, claude-code]
  aif-fanout:
    title: AI Factory fan-out plan refinement
    description: Optional AI Factory plan refinement with independent review perspectives.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-fanout
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, codex-cli, codex-app, claude-code]
  aif-profiled:
    title: AI Factory profiled development workflow
    description: The classic AI Factory route with every step declaring the model profile it wants; plan and implement run in a session of their own; a stopped Run resumes where it stopped. Requires Pri-Fly 0.13.64.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-profiled
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, codex-cli, codex-app, claude-code, model-profile]
  aif-fix:
    title: AI Factory bug fix workflow
    description: Fix a specific bug with regression checks and one review; complex bugs use a native fix-plan executed by aif-fix. Requires Pri-Fly 0.13.76.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-fix
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, bug-fix, codex-cli, codex-app, claude-code]

  aif-review-evidence:
    title: AI Factory explicit review evidence
    description: Review existing code against declared checks, with candidate identity, coverage and a sealed report. No repair or commit. Requires Pri-Fly 0.13.76.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-review-evidence
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, review, codex-cli, codex-app, claude-code]

  aif-ui-ux:
    title: AI Factory UI and UX review
    description: Review declared screens and user flows on a project-owned browser environment, preserve UI/UX reports and release owned resources. Requires Pri-Fly 0.13.76.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-ui-ux
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, ui-ux, codex-cli, codex-app, claude-code]

  aif-feature:
    title: AI Factory small feature workflow
    description: Implement one bounded feature with explicit acceptance and local commit. Sequential by default; optional Codex CLI parallel review requires a reviewed adapter; UI/UX supports 1-3 rounds. Requires Pri-Fly 0.13.77.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: aif-feature
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [ai-factory, feature, codex-cli, codex-app, claude-code]

  openclaw-test-audit:
    title: OpenClaw test audit
    description: Audit changed tests against an adapted OpenClaw checklist, with explicit skip, coverage and candidate freshness. Read-only; no repair or commit. No AI Factory skills required. Requires Pri-Fly 0.13.77.
    category: software-delivery
    repository: https://github.com/StenHigh/prifly-aif-workflows.git
    path: openclaw-test-audit
    ref: v1.53.0
    commit: c85306050df060dc4b381ba7512173806250b3a6
    tags: [openclaw, test-audit, testing, review, codex-cli, codex-app, claude-code]
